<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Delish Bites</h1>
    <p>Fresh • Tasty • Homemade</p>
  </header>

  <main class="menu">
    <section>
      <h2>Starters</h2>
      <div class="grid">
        <div class="card">Bruschetta – $6</div>
        <div class="card">Garlic Bread – $4</div>
        <div class="card">Soup of the Day – $5</div>
      </div>
    </section>

    <section>
      <h2>Main Course</h2>
      <div class="grid">
        <div class="card">Grilled Chicken – $12</div>
        <div class="card">Pasta Alfredo – $10</div>
        <div class="card">Veggie Burger – $9</div>
      </div>
    </section>

    <section>
      <h2>Desserts</h2>
      <div class="grid">
        <div class="card">Cheesecake – $6</div>
        <div class="card">Brownie Sundae – $7</div>
        <div class="card">Fruit Tart – $5</div>
      </div>
    </section>

    <section>
      <h2>Drinks</h2>
      <div class="grid">
        <div class="card">Coffee – $3</div>
        <div class="card">Lemonade – $4</div>
        <div class="card">Smoothie – $5</div>
      </div>
    </section>
  </main>
</body>
</html>
